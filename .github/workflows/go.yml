name: Go

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      HOST: localhost
      PORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root

    strategy:
      fail-fast: false
      matrix:
        go_version: ['1.17', '1.18', '1.22']   # ajuste como preferir
        os: ['ubuntu-latest']                  # corrigido (sem 'ubunto-latest')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go_version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Só UMA célula da matriz sobe os containers para evitar fila
      - name: Ensure Docker Compose plugin
        if: matrix.go_version == '1.22' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin
          docker compose version

      - name: Build DB (Compose)
        if: matrix.go_version == '1.22' && matrix.os == 'ubuntu-latest'
        run: docker compose -f docker-compose.yml build

      - name: Create DB (Compose)
        if: matrix.go_version == '1.22' && matrix.os == 'ubuntu-latest'
        run: docker compose -f docker-compose.yml up -d

      - name: Run tests
        run: go test -v ./...   # cobre o repo todo; se quiser só main_test.go, mantenha

      - name: Down (always)
        if: always() && matrix.go_version == '1.22' && matrix.os == 'ubuntu-latest'
        run: docker compose -f docker-compose.yml down
